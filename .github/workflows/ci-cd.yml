name: ci-cd

on:
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      - run: npm test

  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: docker build -t app:${{ github.sha }} .

      - run: echo "Imagen construida correctamente"

      - run: echo "Despliegue ejecutado correctamente"